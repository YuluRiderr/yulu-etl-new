name: Yulu ETL

on:
  schedule:
    - cron: '30 19 * * *'   # 19:30 UTC = 1:00 AM IST (next day)
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_EMAIL: ${{ secrets.METABASE_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python yulu_etl_v2.py
